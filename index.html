<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EEF1EC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kalori">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Kalori</title>
<style>
:root{--bg:#EEF1EC;--ink:#14231F;--mute:#5E6E69;--card:#fff;--line:#DDE3DD;--acc:#3D3BC8;--sun:#FFB703;--over:#D9480F;color-scheme:light}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.4 ui-rounded,"SF Pro Rounded",system-ui,sans-serif;-webkit-text-size-adjust:100%}
#app{max-width:480px;margin:0 auto;min-height:100%;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 84px)}
h1{font-size:28px;letter-spacing:-.02em}h2{font-size:18px;margin:22px 0 8px}
small,.mute{color:var(--mute);font-size:13px}
button,input{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.card{background:var(--card);border-radius:18px;padding:16px;border:1px solid var(--line)}
.btn{background:var(--acc);color:#fff;border-radius:14px;padding:13px 18px;font-weight:650;width:100%}
.btn.ghost{background:transparent;color:var(--acc);border:1.5px solid var(--acc)}
.btn.sm{width:auto;padding:8px 14px;font-size:14px;border-radius:10px}
input[type=text],input[type=email],input[type=password],input[type=number]{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);margin:4px 0 12px}
label{font-size:13px;color:var(--mute)}
.row{display:flex;gap:10px;align-items:center}.sp{justify-content:space-between}
.days{display:flex;align-items:center;justify-content:space-between;margin:6px 0 14px}
.days button{font-size:26px;padding:4px 14px;color:var(--acc)}
.ring{display:flex;align-items:center;gap:18px}
.ring svg{flex:none;transform:rotate(-90deg)}
.big{font-size:44px;font-weight:750;letter-spacing:-.03em;line-height:1}
.macros{display:flex;gap:18px;margin-top:12px}.macros b{display:block;font-size:17px}
ul{list-style:none;padding:0}
li.m{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
li.m:last-child{border:0}li.m div{flex:1;min-width:0}li.m b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.k{font-weight:700}.x{color:var(--mute);font-size:22px;padding:2px 8px}
.empty{padding:22px 4px;text-align:center;color:var(--mute)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--navbg);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 8px calc(env(safe-area-inset-bottom) + 6px)}
nav div{max-width:480px;margin:auto;display:flex}
nav button{flex:1;padding:12px 4px;border-radius:12px;font-weight:600;color:var(--mute)}
nav button.on{color:var(--acc);background:var(--card)}
.fab{color:#14231F;position:fixed;right:max(16px,calc(50% - 224px));bottom:calc(env(safe-area-inset-bottom) + 78px);background:var(--sun);color:var(--ink);font-weight:750;border-radius:999px;padding:14px 22px;box-shadow:0 6px 18px rgba(20,35,31,.22)}
.ov{position:fixed;inset:0;background:rgba(20,35,31,.45);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.sheet{background:var(--bg);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);max-height:92%;overflow:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media(prefers-reduced-motion:reduce){.sheet{animation:none}}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.chk{display:flex;gap:10px;align-items:center;margin:4px 0 16px;color:var(--ink);font-size:15px}.chk input{width:20px;height:20px}
.toast{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:9;max-width:90%;font-size:14px}
.auth{padding-top:9vh}.auth h1{margin-bottom:6px}.auth p{margin-bottom:22px}
.link{color:var(--acc);font-weight:650;margin-top:16px;display:block;width:100%;text-align:center}
.thumb{width:44px;height:44px;border-radius:10px;object-fit:cover;flex:none}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 8px}
label.btn{display:block;text-align:center;cursor:pointer;margin:0;color:#fff}
label.btn.ghost{color:var(--acc)}
.btn:disabled{opacity:.6}
.it{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.it small{display:block}
.av{border-radius:50%;object-fit:cover;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;flex:none}
.frow{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;width:100%;text-align:left}
.frow small{color:var(--mute)}.newb{color:var(--acc);font-weight:700}
.tap{cursor:pointer}
.hero{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:14px;margin:12px 0;cursor:zoom-in}
.zoom{position:fixed;inset:0;background:#000;z-index:20;display:flex;align-items:center;justify-content:center}.zoom img{max-width:100%;max-height:100%}
select{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);margin:4px 0 12px;font:inherit}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;margin-bottom:14px}.seg button{flex:1;padding:9px;border-radius:10px;font-weight:600;color:var(--mute)}.seg button.on{background:var(--card);color:var(--acc)}
.bars{display:flex;align-items:flex-end;gap:3px;height:130px;position:relative}.bars i{flex:1;background:var(--acc);border-radius:4px 4px 0 0;min-height:2px}.bars i.over{background:var(--over)}
.gl{position:absolute;left:0;right:0;border-top:2px dashed var(--sun)}
.bl{display:flex;gap:3px;margin-top:4px}.bl span{flex:1;text-align:center;font-size:11px;color:var(--mute)}
.mbar{display:flex;height:12px;border-radius:6px;overflow:hidden;margin:12px 0;background:var(--soft)}.mbar i{display:block}
.big small{font-size:16px;font-weight:500;color:var(--mute)}
.gh{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0 4px;border-bottom:1px solid var(--line)}

:root{--soft:#E3E8E3;--navbg:rgba(238,241,236,.94)}
:root[data-theme=dark]{--bg:#0F1715;--ink:#E7EEEA;--mute:#93A39D;--card:#17221F;--line:#26332F;--acc:#7C7AF5;--over:#FF8A4C;--soft:#26332F;--navbg:rgba(15,23,21,.94);color-scheme:dark}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0F1715;--ink:#E7EEEA;--mute:#93A39D;--card:#17221F;--line:#26332F;--acc:#7C7AF5;--over:#FF8A4C;--soft:#26332F;--navbg:rgba(15,23,21,.94);color-scheme:dark}}
select{color:var(--ink)}
.sbar{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 134px);max-width:456px;margin:auto;background:var(--ink);color:var(--bg);padding:10px 12px;border-radius:14px;display:flex;gap:10px;align-items:center;z-index:8;font-size:14px}
.sbar .x{color:var(--bg)}
nav button{font-size:14px}
input[type=time]{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);margin:4px 0 12px;color:var(--ink)}

:root{--cp:#E5484D;--cc:#F5A524;--cf:#3B82F6}
:root[data-theme=dark]{--cp:#FF6B70;--cc:#FFC04D;--cf:#6AA3FF}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--cp:#FF6B70;--cc:#FFC04D;--cf:#6AA3FF}}
.d{display:inline-block;width:8px;height:8px;border-radius:50%;margin:0 4px 0 8px;vertical-align:middle}
.macros .k-p{border-top:3px solid var(--cp);padding-top:6px}.macros .k-c{border-top:3px solid var(--cc);padding-top:6px}.macros .k-f{border-top:3px solid var(--cf);padding-top:6px}
#app{padding-top:calc(env(safe-area-inset-top) + 58px)}
.appbar{position:fixed;top:0;left:0;right:0;z-index:4;background:var(--navbg);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 6px) 16px 6px}
.appbar>div{max-width:480px;margin:auto;display:flex;justify-content:space-between;align-items:center}
.bell{position:relative;padding:6px;color:var(--ink)}
.nb{position:absolute;top:-2px;right:-4px;min-width:17px;height:17px;border-radius:9px;background:var(--over);color:#fff;font:700 10px/17px system-ui;font-style:normal;text-align:center;padding:0 4px}
nav div{align-items:center}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;padding:8px 2px;position:relative}
nav button.on{background:transparent;color:var(--acc)}
nav .nb{top:2px;right:calc(50% - 24px)}
nav .plus{flex:none;width:58px;height:58px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:34px;font-weight:400;line-height:1;margin:-26px 6px 0;padding:0;justify-content:center;box-shadow:0 6px 16px rgba(20,35,31,.25)}
.sbox{display:flex;align-items:center;gap:6px;background:var(--soft);border-radius:14px;padding:3px 6px 3px 12px;margin:14px 0 8px;color:var(--mute)}
.sbox input{flex:1;min-width:0;border:0;background:transparent;margin:0;padding:11px 4px;font-size:16px;color:var(--ink);outline:none}
.sbox .bcb{padding:8px;border-radius:10px;color:var(--ink)}
</style></head>
<body><div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="config.js"></script>
<script>
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const S={tab:'today',day:new Date(),meals:[],fr:[],names:{},feed:[],sheet:false,mode:'login',urls:{},ai:null,pr:{},av:{},view:null,detail:null,zoom:null,body:null,rep:null,rt:'week'};
const range=d=>{const a=new Date(d);a.setHours(0,0,0,0);const b=new Date(a);b.setDate(b.getDate()+1);return[a.toISOString(),b.toISOString()]};
const hm=t=>new Date(t).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),3200)}
function trErr(m=''){
 if(/Invalid login/i.test(m))return'E-posta veya şifre hatalı.';
 if(/already registered/i.test(m))return'Bu e-posta zaten kayıtlı.';
 if(/at least 6/i.test(m))return'Şifre en az 6 karakter olmalı.';
 if(/Database error saving/i.test(m))return'Bu kullanıcı adı alınmış olabilir, başka dene.';
 if(/duplicate key/i.test(m))return'Bu istek zaten var.';
 return m}

/* ---------- Giriş ---------- */
function authView(){
 const reg=S.mode==='register';
 app.innerHTML=`<div class="auth"><h1>Kalori</h1><p class="mute">${reg?'Hesap oluştur, öğünlerini kaydetmeye başla.':'Hesabınla giriş yap.'}</p>
 <form data-form="auth">
 ${reg?`<label>Kullanıcı adı (arkadaşların seni bununla bulur)</label><input type="text" name="username" required pattern="[a-zA-Z0-9_]{3,20}" autocapitalize="none" autocomplete="username">`:''}
 <label>E-posta</label><input type="email" name="email" required autocomplete="email">
 <label>Şifre</label><input type="password" name="password" required minlength="6" autocomplete="${reg?'new-password':'current-password'}">
 <button class="btn">${reg?'Hesap oluştur':'Giriş yap'}</button></form>
 <button class="link" data-act="mode">${reg?'Zaten hesabım var':'Yeni hesap oluştur'}</button></div>`}

async function submitAuth(f){
 const email=f.get('email'),password=f.get('password');let r;
 if(S.mode==='login')r=await db.auth.signInWithPassword({email,password});
 else r=await db.auth.signUp({email,password,options:{data:{username:(f.get('username')||'').trim().toLowerCase()}}});
 if(r.error)return toast(trErr(r.error.message));
 if(!r.data.session){toast('Kayıt oluştu. E-postanı onaylayıp giriş yap.');S.mode='login';return authView()}
 boot()}

/* ---------- Veri ---------- */
async function boot(){
 const{data:{session}}=await db.auth.getSession();
 if(!session)return authView();
 S.me=session.user;
 const{data:p}=await db.from('profiles').select('*').eq('id',S.me.id).single();
 if(!p){await db.auth.signOut();return authView()}
 S.p=p;{const{data:bi}=await db.from('body_info').select('*').maybeSingle();S.body=bi}
 {const{data:np}=await db.from('notif_prefs').select('*').maybeSingle();S.np=np}
 await cleanupPhotos();
 await load()}

async function load(){
 const[a,b]=range(S.day);
 const[m,f,n]=await Promise.all([
  db.from('meals').select('*').eq('user_id',S.me.id).gte('eaten_at',a).lt('eaten_at',b).order('eaten_at'),
  db.from('friendships').select('*'),
  db.from('notifications').select('*').order('created_at',{ascending:false}).limit(40)]);
 S.meals=m.data||[];S.fr=f.data||[];
 const nt=n.data||[],ids=[...new Set([...S.fr.flatMap(x=>[x.requester,x.addressee]),...nt.map(x=>x.actor_id)])].filter(i=>i!==S.me.id);
 S.names={};
 S.pr={[S.me.id]:S.p};
 if(ids.length){const{data:ps}=await db.from('profiles').select('id,username,avatar_path,daily_goal').in('id',ids);(ps||[]).forEach(p=>{S.names[p.id]=p.username;S.pr[p.id]=p})}
 const fids=S.fr.filter(x=>x.status==='accepted').map(x=>x.requester===S.me.id?x.addressee:x.requester);
 S.feed=[];
 if(fids.length){const{data:fm}=await db.from('meals').select('*').in('user_id',fids).gte('eaten_at',a).lt('eaten_at',b).order('eaten_at',{ascending:false});S.feed=fm||[]}
 {const old=new Set((S.nt||[]).map(x=>x.id));S.nt=nt;
  if(S.ntLoaded){const nw=nt.filter(x=>!x.read&&!old.has(x.id));if(nw.length)toast(ntText(nw[0])+(nw.length>1?` (+${nw.length-1})`:''))}
  S.ntLoaded=true}
 if(!S.stT||Date.now()-S.stT>120000){S.stT=Date.now();await loadStreaks([S.me.id,...fids])}
 const ps=[...S.meals,...S.feed].map(m=>m.photo_path).filter(Boolean);S.urls={};
 if(ps.length){const{data:su}=await db.storage.from('meal-photos').createSignedUrls(ps,3600);(su||[]).forEach(x=>{if(x.signedUrl)S.urls[x.path]=x.signedUrl})}
 const ap=Object.values(S.pr).map(p=>p.avatar_path).filter(Boolean);S.av={};
 if(ap.length){const{data:au}=await db.storage.from('avatars').createSignedUrls(ap,3600);(au||[]).forEach(x=>{if(x.signedUrl)S.av[x.path]=x.signedUrl})}
 render()}

/* ---------- Ekranlar ---------- */
function dayBar(){
 const today=new Date().toDateString()===S.day.toDateString();
 const t=today?'Bugün':S.day.toLocaleDateString('tr-TR',{weekday:'long',day:'numeric',month:'long'});
 return`<div class="days"><button data-act="prev" aria-label="Önceki gün">‹</button><h1>${t}</h1><button data-act="next" aria-label="Sonraki gün" ${today?'disabled style="opacity:.25"':''}>›</button></div>`}

function todayView(){
 const sum=k=>Math.round(S.meals.reduce((s,m)=>s+(+m[k]||0),0));
 const eaten=sum('kcal'),goal=S.p.daily_goal,left=goal-eaten,over=left<0,C=2*Math.PI*54;
 const list=mealList();
 return`${dayBar()}${streakLine()}${remindView()}<div class="card"><div class="ring">
 <svg width="124" height="124" viewBox="0 0 124 124"><circle cx="62" cy="62" r="54" fill="none" style="stroke:var(--soft)" stroke-width="12"/><circle cx="62" cy="62" r="54" fill="none" stroke="${over?'var(--over)':'var(--acc)'}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-Math.min(eaten/goal,1))}"/></svg>
 <div><div class="big" style="color:${over?'var(--over)':'inherit'}">${Math.abs(left)}</div><div class="mute">${over?'kcal hedefin üstünde':'kcal kaldı'}</div><small>${eaten} / ${goal} kcal yendi</small></div></div>
 <div class="macros"><div class="k-p"><b>${sum('protein')} g</b><small>protein</small></div><div class="k-c"><b>${sum('carbs')} g</b><small>karbonhidrat</small></div><div class="k-f"><b>${sum('fat')} g</b><small>yağ</small></div></div></div>
 <h2>Öğünler</h2><div class="card" style="padding:4px 16px">${list}</div>${adviceView()}
 `}

const hue=s=>[...s].reduce((a,c)=>a+c.charCodeAt(0),0)*47%360;
function avatar(id,sz=44){const p=id===S.me.id?S.p:(S.pr[id]||{}),u=p.avatar_path&&S.av[p.avatar_path],n=p.username||S.names[id]||'?';
 return u?`<img class="av" style="width:${sz}px;height:${sz}px" src="${u}" alt="">`:`<span class="av" style="width:${sz}px;height:${sz}px;font-size:${Math.round(sz*.42)}px;background:hsl(${hue(n)} 42% 36%)">${esc(n[0].toUpperCase())}</span>`}
const seen=id=>{try{return localStorage.getItem('seen_'+id)||''}catch{return''}};
function markSeen(id){const ms=S.feed.filter(m=>m.user_id===id);if(!ms.length)return;try{localStorage.setItem('seen_'+id,ms.map(m=>m.eaten_at).sort().pop())}catch{}}
function friendsView(){
 if(S.view?.friend)return friendPage(S.view.friend);
 const me=S.me.id,inc=S.fr.filter(x=>x.status==='pending'&&x.addressee===me),out=S.fr.filter(x=>x.status==='pending'&&x.requester===me),acc=S.fr.filter(x=>x.status==='accepted');
 const other=x=>x.requester===me?x.addressee:x.requester,today=new Date().toDateString()===S.day.toDateString();
 const by={};S.feed.forEach(m=>(by[m.user_id]??=[]).push(m));
 const row=x=>{const id=other(x),ms=by[id]||[],s=seen(id),nw=today?ms.filter(m=>!s||new Date(m.eaten_at)>new Date(s)).length:0,tot=ms.reduce((a,m)=>a+m.kcal,0);
  const sub=nw?`<span class="newb">${nw} yeni öğün</span>`:ms.length?`${ms.length} öğün, ${tot} kcal`:'Öğün yok';
  const ph=ms.filter(m=>S.urls[m.photo_path]).slice(0,3).map(m=>`<img class="thumb" style="width:34px;height:34px;border-radius:8px" src="${S.urls[m.photo_path]}" alt="">`).join('');
  return`<button class="frow" data-act="friend" data-id="${id}">${avatar(id,48)}<span style="flex:1;min-width:0"><b>${esc(S.names[id]||'?')}</b>${(S.st?.[id]||0)>=2?`<small class="newb"> ${S.st[id]} gün seri</small>`:''}<small style="display:block">${sub}</small></span><span class="row" style="gap:4px">${ph}</span><span class="mute">›</span></button>`};
 return`${dayBar()}
 <form data-form="friend" class="row" style="align-items:flex-end"><div style="flex:1"><label>Kullanıcı adıyla arkadaş ekle</label><input type="text" name="u" required autocapitalize="none" style="margin-bottom:0"></div><button class="btn sm" style="height:50px">İstek gönder</button></form>
 ${inc.length?`<h2>Gelen istekler</h2>${inc.map(x=>`<div class="card row sp" style="margin-bottom:8px"><span class="row">${avatar(x.requester,36)}<b>${esc(S.names[x.requester])}</b></span><span class="row"><button class="btn sm" data-act="accept" data-id="${x.id}">Kabul et</button><button class="btn sm ghost" data-act="unfriend" data-id="${x.id}">Reddet</button></span></div>`).join('')}`:''}
 ${out.length?`<h2>Gönderilen istekler</h2>${out.map(x=>`<div class="card row sp" style="margin-bottom:8px"><span>${esc(S.names[x.addressee])}</span><small>yanıt bekliyor</small></div>`).join('')}`:''}
 <h2>Arkadaşlar</h2>${acc.length?acc.map(row).join(''):'<div class="empty">Henüz arkadaşın yok. Yukarıdan kullanıcı adıyla ekle.</div>'}`}
function friendPage(id){
 const x=S.fr.find(f=>f.status==='accepted'&&(f.requester===id||f.addressee===id)),ms=S.feed.filter(m=>m.user_id===id),tot=ms.reduce((a,m)=>a+m.kcal,0),g=S.pr[id]?.daily_goal;
 return`<button class="link" style="text-align:left;margin:0 0 8px" data-act="fback">‹ Arkadaşlar</button>
 <div class="row" style="gap:14px">${avatar(id,64)}<div><h1>${esc(S.names[id]||'')}</h1><small>${tot} kcal${g?` / ${g} hedef`:''}</small></div></div>${dayBar()}

async function loadReport(){

 const{data}=await db.from('meals').select('kcal,protein,carbs,fat,eaten_at').eq('user_id',S.me.id).gte('eaten_at',a.toISOString());
 const{data:wt}=await db.from('weights').select('day,kg').order('day',{ascending:false}).limit(60);S.wt=wt||[];
 const ds=Array.from({length:30},(_,i)=>{const d=new Date(a);d.setDate(a.getDate()+i);return{d,kcal:0,p:0,c:0,f:0,n:0}});
 (data||[]).forEach(m=>{const t=new Date(m.eaten_at);t.setHours(0,0,0,0);const x=ds[Math.round((t-a)/864e5)];if(x){x.kcal+=m.kcal;x.p+=+m.protein||0;x.c+=+m.carbs||0;x.f+=+m.fat||0;x.n++}});
 S.rep=ds;render()}

 const b64=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result.split(',')[1]);fr.readAsDataURL(blob)});
